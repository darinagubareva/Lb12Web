<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <title>Команди Git</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: Arial, sans-serif;
            }
            body {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                background-color: #ffffff;
            }
            header {
                background-color: #3498f3;
                border-bottom: 3px solid #e74c3c;
                padding: 12px 25px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .logo-block h1 {
                font-size: 24px;
                color: #000000;
                font-weight: bold;
            }
            .logo-block p {
                color: #ffffff;
                font-size: 13px;
                font-weight: bold;
                margin-left: 35px;
                margin-top: 2px;
            }
            nav a {
                color: #000000;
                text-decoration: none;
                margin-left: 18px;
                font-size: 15px;
            }
            nav a:hover {
                text-decoration: underline;
            }
            main {
                flex: 1;
                max-width: 1250px;
                width: 100%;
                margin: 0 auto;
                padding: 25px 30px;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 28px;
            }
            .col-blue h2 { color: #5dade2; }
            .col-green h2 { color: #6ab04c; }
            .col-lime h2 { color: #82cc28; }
            .col-orange h2 { color: #f36838; }

            .section-group {
                margin-bottom: 24px;
            }
            .section-group h2 {
                font-size: 21px;
                margin-bottom: 12px;
            }
            .cmd-item {
                margin-bottom: 14px;
            }
            .cmd-desc {
                font-size: 13px;
                color: #222222;
                margin-bottom: 4px;
                line-height: 1.35;
            }
            .cmd-code {
                font-family: "Courier New", Consolas, monospace;
                font-size: 13px;
                font-weight: bold;
                color: #000000;
            }
            .cmd-link {
                color: #3498f3;
                text-decoration: none;
            }
            footer {
                background-color: #2c3539;
                color: #ffffff;
                text-align: center;
                padding: 22px 10px;
                font-size: 12px;
                line-height: 1.5;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="logo-block">
                <h1>Мій особистий блог</h1>
                <p>Дарина Губарева</p>
            </div>
            <nav>
                <a href="#">Вхід</a>
                <a href="register.html">Реєстрація</a>
            </nav>
        </header>

        <main>
            <!-- КОЛОНКА 1 -->
            <div class="column col-blue">
                <!-- Create a Repository та Observe your Repository -->
            </div>

            <!-- КОЛОНКА 2 -->
            <div class="column col-green">
                <!-- Working with Branches -->
            </div>

            <!-- КОЛОНКА 3 -->
            <div class="column col-lime">
                <!-- Make a change -->
            </div>

            <!-- КОЛОНКА 4 -->
            <div class="column col-orange">
                <!-- Synchronize та Finally! -->
            </div>
        </main>

        <footer>
            <p>© Всі права захищені.</p>
            <p>Розробник: студентка 303-ТН навчальної групи Губарева Д.</p>
        </footer>
    </body>
</html>
